name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - run: flutter pub get

      # 强制在编译前创建目录并写入基础主入口，防止找不到文件
      - name: Force create main.dart
        run: |
          mkdir -p lib
          echo "import 'package:flutter/material.dart'; void main() => runApp(const MaterialApp(home: Scaffold(body: Center(child: Text('Guitar Tuner')))));" > lib/main.dart

      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
